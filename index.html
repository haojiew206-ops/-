<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>心晴守望</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <div class="layout">
    <aside class="side">
      <h2>🌿 心晴守望</h2>
      <nav>
        <p onclick="page('student')">🏠 学生端入口</p>
        <p onclick="page('teacher')">📊 教师预警看板</p>
      </nav>
      <div style="position:absolute; bottom:20px; font-size:12px; opacity:0.3; width:180px; text-align:center;">© 2024 系统作品</div>
    </aside>
    <main class="main">
      <header class="head">
        <h1>大学生心理健康智能监测与预警平台</h1>
        <div id="time" style="margin-left:auto; color:#888; font-size:14px;"></div>
      </header>
      <section id="content" class="box"></section>
    </main>
  </div>
  <!-- 使用国内最稳定的 ECharts 镜像地址 -->
  <script src="https://staticfile.org"></script>
  <script src="app.js"></script>
  <script>
    function clock() { 
      const el = document.getElementById('time');
      if(el) el.innerText = new Date().toLocaleString(); 
    }
    setInterval(clock, 1000); clock();
  </script>
</body>
</html>
